run_name: core_benchmark
dataset: {name: synthetic}
methods:
  - {name: fixed_256, chunk_size: 256}
  - {name: fixed_512, chunk_size: 512}
  - {name: sentence_fixed_256, chunk_size: 256}
  - {name: sentence_fixed_512, chunk_size: 512}
  - {name: semantic_breakpoint}
  - {name: semantic_single_linkage_paper_exact}
  - {name: meta_ppl_raw}
  - {name: meta_ppl_dynamic_512}
  - {name: pic_paper_reimplementation}
  - {name: pic_reimplementation_capped_512}
  - {name: late_fixed_256}
  - {name: late_fixed_512}
embedding: {name: hashing, dimension: 256}
retrieval: {name: cosine}
evaluation: {k_values: [3, 5, 10], token_budgets: [2048], retrieval_depth: 100, strict_token_budget: true, duplicate_scope: within_document}
output_dir: outputs
seed: 42
smoke: false
fail_fast: false
